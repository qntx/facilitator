name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@main
    with:
      submodules: true
      # hedera-proto (chain-hedera, pulled by --all-features) runs protoc in build.rs
      apt-packages: protobuf-compiler
