name: Docker

# Tag v* publishes to GHCR with SBOM + provenance attestation.
# Org metadata-action flavor latest=auto: v2.0.0 also moves
# ghcr.io/qntx/facilitator:latest and :2. Operators pin :2.0.0 or a digest.
# pull_request and workflow_dispatch are build-only (push: false, no SBOM).
# linux/amd64 only: Dockerfile runs native cargo; dual-arch would QEMU-compile r402.

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    uses: qntx/workflows/.github/workflows/publish-container.yml@v2.0.0
    permissions:
      contents: read
    with:
      push: false
      platforms: linux/amd64
      timeout-minutes: 90
      no-cache: false

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    uses: qntx/workflows/.github/workflows/publish-container.yml@v2.0.0
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      push: true
      attest: true
      platforms: linux/amd64
      timeout-minutes: 90
      no-cache: true
