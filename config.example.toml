# x402 Facilitator Configuration
# https://qntx.org
#
# Key concepts:
#   - [signers]  — configure private keys ONCE, shared across all chains
#   - [chains.*] — only RPC endpoints needed per chain
#   - Schemes are Cargo features (EVM exact, Solana exact, scheme-upto; opt-in scheme-batch-settlement).
#     Do not add [[schemes]]. This process does not host auth-capture.
#   - Env var references: "$VAR" or "${VAR}" are resolved at startup

host = "0.0.0.0"
port = 8080
# Log level filter (RUST_LOG env var takes precedence when set).
# Examples: "info", "debug", "facilitator=debug,r402=trace"
log_level = "info"

# Global Signers
#
# Shared across all chains of the same type.
# Per-chain overrides: EVM `signers`, Solana `signer`, NEAR `relayers`.
# XRPL has no signer; do not set [signers].xrpl.
#
# Use environment variable references ($VAR or ${VAR}) for secrets.

[signers]
evm = ["$EVM_SIGNER_PRIVATE_KEY"]          # hex, 0x-prefixed
solana = "$SOLANA_SIGNER_PRIVATE_KEY"       # base58, 64-byte keypair
# near = [{ account_id = "relayer.testnet", secret_key = "$NEAR_SECRET_KEY" }]  # --features chain-near

# EIP-155 (EVM) Chains
#
# Key format: "eip155:<chain_id>"
# Only RPC config needed — signers injected from [signers] above.
# receipt_timeout_secs defaults to 20 (must stay below the 30 s HTTP timeout).

[chains."eip155:84532"]
rpc = [{ http = "https://sepolia.base.org" }]
receipt_timeout_secs = 20

[chains."eip155:8453"]
rpc = [{ http = "https://mainnet.base.org" }]

[chains."eip155:1"]
rpc = [{ http = "https://ethereum-rpc.publicnode.com" }]

# Solana Chains
#
# Key format: "solana:<truncated_genesis_hash>"
# rpc is a string. Optional: pubsub, max_compute_unit_limit (200000),
# max_compute_unit_price (1000000), enable_smart_wallet_verification (false),
# allow_additional_instructions (true), max_instruction_count (6).

[chains."solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1"]
rpc = "https://api.devnet.solana.com"

[chains."solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp"]
rpc = "https://api.mainnet-beta.solana.com"

# NEAR exact — compile with --features chain-near
# Add `near = [...]` under the existing [signers] table above (do not add a second [signers]).
# Injects into chain `relayers`. Nested $VAR is resolved.
# rpc is optional (FastNEAR default). max_sponsored_gas is optional scheme JSON.
#
# [chains."near:testnet"]
# rpc = "https://rpc.testnet.fastnear.com"
# max_sponsored_gas = 100000000000000

# XRPL exact — compile with --features chain-xrpl
# No facilitator signer (payer pays fees). [signers].xrpl is a startup error.
# rpc is optional (default public JSON-RPC for xrpl:0 / xrpl:1 / xrpl:2).
#
# [chains."xrpl:1"]
# rpc = "https://s.altnet.rippletest.net:51234"
