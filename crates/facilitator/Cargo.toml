[package]
name = "facilitator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
readme = "../../README.md"

[lib]
name = "facilitator"
path = "src/lib.rs"

[[bin]]
name = "facilitator"
path = "src/main.rs"

[features]
default = ["evm", "svm", "telemetry", "metrics"]
evm = [
    "dep:r402-evm",
    "dep:r402-extensions",
    "dep:alloy-network",
    "dep:alloy-primitives",
    "dep:alloy-signer-local",
]
svm = ["dep:r402-svm", "dep:solana-keypair"]
near = ["dep:r402-near", "r402-near/facilitator"]
xrpl = ["dep:r402-xrpl", "r402-xrpl/facilitator"]
hedera = ["dep:r402-hedera", "r402-hedera/facilitator"]
avm = ["dep:r402-avm", "r402-avm/facilitator"]
aptos = ["dep:r402-aptos", "r402-aptos/facilitator"]
keeta = ["dep:r402-keeta", "r402-keeta/facilitator", "dep:base64"]
tvm = ["dep:r402-tvm", "r402-tvm/facilitator"]
stellar = ["dep:r402-stellar", "r402-stellar/facilitator"]
concordium = ["dep:r402-concordium", "r402-concordium/facilitator"]
experimental-tron = ["dep:r402-tron", "r402-tron/facilitator", "dep:alloy-signer-local"]
telemetry = [
    "r402-evm?/telemetry",
    "r402-svm?/telemetry",
    "r402-near?/telemetry",
    "r402-xrpl?/telemetry",
    "r402-hedera?/telemetry",
    "r402-avm?/telemetry",
    "r402-aptos?/telemetry",
    "r402-keeta?/telemetry",
    "r402-tvm?/telemetry",
    "r402-stellar?/telemetry",
    "r402-concordium?/telemetry",
    "r402-tron?/telemetry",
]
metrics = ["dep:metrics", "dep:metrics-exporter-prometheus", "r402-facilitator/metrics"]

[dependencies]
alloy-network = { workspace = true, optional = true }
alloy-primitives = { workspace = true, optional = true }
alloy-signer-local = { workspace = true, optional = true }
axum = { workspace = true }
base64 = { version = "0.23", optional = true }
clap = { workspace = true }
compact_str = { workspace = true }
humantime-serde = { workspace = true }
metrics = { workspace = true, optional = true }
metrics-exporter-prometheus = { workspace = true, optional = true }
r402-facilitator = { version = "0.20", default-features = false }
r402-protocol = "0.20"
serde = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }

r402-evm = { version = "0.20", default-features = false, features = ["facilitator"], optional = true }
r402-extensions = { version = "0.20", default-features = false, features = ["ext-builder-code", "ext-erc20-approval"], optional = true }
r402-svm = { version = "0.20", default-features = false, features = ["facilitator"], optional = true }
r402-near = { version = "0.20", default-features = false, optional = true }
r402-xrpl = { version = "0.20", default-features = false, optional = true }
r402-hedera = { version = "0.20", default-features = false, optional = true }
r402-avm = { version = "0.20", default-features = false, optional = true }
r402-aptos = { version = "0.20", default-features = false, optional = true }
r402-keeta = { version = "0.20", default-features = false, optional = true }
r402-tvm = { version = "0.20", default-features = false, optional = true }
r402-stellar = { version = "0.20", default-features = false, optional = true }
r402-concordium = { version = "0.20", default-features = false, optional = true }
r402-tron = { version = "0.20", default-features = false, optional = true }
solana-keypair = { workspace = true, optional = true }

[dev-dependencies]
http-body-util = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true }

[lints]
workspace = true
