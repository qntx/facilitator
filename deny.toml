# cargo-deny configuration for the facilitator workspace.
# Run: `cargo deny check` (also wired into CI / Justfile).

[graph]
all-features = true

[output]
feature-depth = 1

[advisories]
ignore = [
  # --- The five rustls / rustls-webpki advisories below ---
  # Fixes need rustls >= 0.23.45/0.23.46 and rustls-webpki >= 0.103.16, all
  # of which require aws-lc-rs ^1.18 in the resolved graph. aws-lc-rs is
  # pinned at =1.16.2 by an UNCONDITIONAL dependency of near-crypto 0.37.4
  # (r402-near 0.20.0 -> near-jsonrpc-client -> near-crypto), and
  # aws-lc-sys's `links` attribute forbids a second copy, so
  # `cargo update -p rustls --precise 0.23.46` fails with
  # "failed to select a version for `aws-lc-rs` ... required by package
  # `rustls v0.23.46` ... previously selected package `aws-lc-rs v1.16.2`
  # ... required by `near-crypto v0.37.4` ... via `r402-near v0.20.0`".
  # There is no lockfile- or feature-only escape: reqwest's `rustls`
  # feature hard-enables `__rustls-aws-lc-rs`, `rustls-no-provider` would
  # need a code-level CryptoProvider install, and anza-quinn/solana-* also
  # force rustls's aws_lc_rs. The pin relaxes only in near-* 0.38.x — a
  # semver-major bump through r402-near, tracked upstream in r402.
  #
  # Exposure: facilitator is a deployed payment server holding signing
  # keys. It does NOT terminate TLS (axum on a plain TcpListener — no
  # TlsAcceptor/ServerConfig in src/), so only the client side of these
  # advisories applies, via outbound TLS: reqwest 0.12.28 -> Solana RPC
  # (verifies with rustls-webpki + webpki-roots), reqwest 0.13.4 -> EVM
  # RPC via alloy (verifies with rustls-platform-verifier = OS trust
  # store), tokio-tungstenite -> Solana pubsub wss, anza-quinn -> Solana
  # validator QUIC (solana-tls-utils skips server verification).
  # rustls 0.23.43 / rustls-webpki 0.103.13.
  # - 0285: REACHABLE as a TLS client to a malicious/MITM'd RPC endpoint;
  #   it could send unencrypted handshake messages rustls wrongly
  #   accepts. Advisory: transcript still authenticated — no auth bypass.
  # - 0346: not reachable — needs a custom ClientSessionStore impl that
  #   Debug-formats session values; none in workspace or registry deps.
  # - 0348: not reachable — needs the non-default `brotli` feature; off
  #   (`cargo tree -e features -i rustls`).
  # - 0349: REACHABLE in principle (outbound TLS + session cache), no
  #   practical impact: `prefer-post-quantum` is off so X25519MLKEM768 is
  #   already last in DEFAULT_KX_GROUPS — a forced classical share is the
  #   default anyway; also needs a hybrid-preferring server.
  # - 0382: REACHABLE — the Solana RPC path (reqwest 0.12.28,
  #   rustls-tls-webpki-roots) verifies through rustls-webpki against
  #   webpki-roots, and webpki-roots 1.0.10 still ships the emSign roots.
  #   A MITM or malicious RPC endpoint could present a chain through the
  #   distrusted intermediates (whose keys are now public). Not reached
  #   via reqwest 0.13.4 (platform verifier = OS verifies) or QUIC
  #   (verification skipped).
  #
  # Revisit: when r402-* moves to near-* 0.38.x, run
  # `cargo update -p rustls -p rustls-webpki` and remove these entries;
  # review by 2027-02-27.
  { id = "RUSTSEC-2026-0285", reason = "REACHABLE via outbound TLS to a malicious/MITM RPC endpoint (plaintext handshake msgs wrongly accepted; advisory notes no auth bypass); fix needs aws-lc-rs ^1.18, pinned =1.16.2 by near-crypto until the near-* 0.38 bump; review by 2027-02-27" },
  { id = "RUSTSEC-2026-0346", reason = "not reachable: needs a custom ClientSessionStore that Debug-formats session values — none in this graph (built-in cache redacts); fix blocked by near-crypto's aws-lc-rs =1.16.2 pin; review by 2027-02-27" },
  { id = "RUSTSEC-2026-0348", reason = "not reachable: needs rustls's non-default `brotli` feature, off in this graph; fix blocked by near-crypto's aws-lc-rs =1.16.2 pin; review by 2027-02-27" },
  { id = "RUSTSEC-2026-0349", reason = "REACHABLE in principle via outbound TLS + session cache but no practical impact — prefer-post-quantum off, hybrid kx already last; fix blocked by near-crypto's aws-lc-rs =1.16.2 pin; review by 2027-02-27" },
  { id = "RUSTSEC-2026-0382", reason = "REACHABLE: Solana RPC path (reqwest 0.12.28) verifies via rustls-webpki against webpki-roots, and 1.0.10 still ships emSign roots — a MITM/malicious RPC endpoint can forge a chain through the distrusted intermediates; fix blocked by near-crypto's aws-lc-rs =1.16.2 pin; review by 2027-02-27" },
  # crypto-bigint timing variability in ops intended constant-time
  # (subtraction, division, Montgomery mul, limb equality, inversion):
  # patched only in >= 0.7.6. The lockfile holds 0.5.5 via elliptic-curve
  # 0.13.8 / alloy-signer 2.4.1 (requires ^0.5.1) and 0.6.1 via
  # keetanetwork-crypto 0.3.0 (requires ^0.6.1) — neither upstream offers
  # an in-range fix.
  # REACHABLE: EVM settlement signs with PrivateKeySigner
  # (src/compose/evm.rs -> alloy-signer-local -> k256 -> elliptic-curve
  # -> crypto-bigint 0.5.5), and keeta settlement goes through
  # keetanetwork-crypto -> 0.6.1 — secret-scalar arithmetic runs through
  # the affected ops on every signature. Exploitation needs a timing /
  # microarchitectural side channel (typically local or co-resident
  # observation), but this server holds the keys being leaked.
  # Revisit: remove when alloy moves to elliptic-curve 0.14 and
  # keetanetwork-* move off crypto-bigint 0.6; review by 2027-02-27.
  { id = "RUSTSEC-2026-0387", reason = "REACHABLE: facilitator signs every EVM/keeta settlement through crypto-bigint 0.5.5 (PrivateKeySigner->k256->elliptic-curve) and 0.6.1 (keetanetwork-crypto); exploit needs a local/co-resident timing channel; no in-range patch; review by 2027-02-27" },
  # url <= 2.5.8: `Url::origin()` recurses once per nested `blob:` prefix
  # and can overflow the stack. Across the workspace and every registry
  # crate in Cargo.lock the only caller (nothing calls
  # `url::quirks::origin()`) is r402-extensions' `SiwxOrigin::parse`,
  # which rejects every non-http(s) scheme before `.origin()` — `blob:`
  # can never reach it.
  # Fixed in 2.5.9, published 2026-11-20T23:03Z.
  # Revisit: from 2026-11-28 (7-day rule) run `cargo update -p url` to
  # 2.5.9 and remove this entry.
  { id = "RUSTSEC-2026-0592", reason = "not reachable: sole Url::origin() caller r402-extensions SiwxOrigin::parse rejects non-http(s) before .origin(), so blob: never reaches it; bump url to 2.5.9 and remove from 2026-11-28" },
  # --- Unmaintained (not vulnerable); transitive-only, upstream must move.
  # instant 0.1.3x via backoff 0.4.0 <- hedera 0.43.0 <- r402-hedera
  # (also fastrand <- futures-lite <- wstd <- keetanetwork-client).
  { id = "RUSTSEC-2024-0384", reason = "instant unmaintained via backoff <- hedera <- r402-hedera and fastrand/wstd <- keetanetwork-client; remove when upstream moves; review by 2027-02-27" },
  # backoff 0.4.0 via hedera 0.43.0 <- r402-hedera 0.20.
  { id = "RUSTSEC-2025-0012", reason = "backoff unmaintained via hedera <- r402-hedera; remove when upstream moves; review by 2027-02-27" },
  # derivative via ark-ec/ark-ff/ark-poly <- concordium_base <-
  # concordium-rust-sdk <- r402-concordium; proc-macro, compile time only.
  { id = "RUSTSEC-2024-0388", reason = "derivative unmaintained via ark-* <- concordium-rust-sdk <- r402-concordium; proc-macro only; remove when upstream moves; review by 2027-02-27" },
  # paste via alloy-primitives; proc-macro, compile time only.
  { id = "RUSTSEC-2024-0436", reason = "paste unmaintained via alloy-primitives; proc-macro only; remove when alloy replaces it; review by 2027-02-27" },
  # unsafe-libyaml via serde_yaml <- near-parameters (near tree) and
  # progenitor <- keetanetwork-client.
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained via serde_yaml <- near-parameters/progenitor; remove when upstream moves; review by 2027-02-27" },
  # bincode 1.3.3 via r402-svm 0.20 and the solana-* client chain. A bump
  # to r402-svm 0.21 exists but is an API break (see dependabot PRs).
  { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained via r402-svm and solana-* chain; remove when upstream moves to bincode 2.x; review by 2027-02-27" },
  # humantime via humantime-serde (direct dep of facilitator).
  { id = "RUSTSEC-2026-0542", reason = "humantime unmaintained via humantime-serde (direct dep); remove when upstream moves or the dep is replaced; review by 2027-02-27" },
  # chrono via concordium-contracts-common / concordium-rust-sdk /
  # concordium_base and keetanetwork-asn1 — unconditional dep compiled on
  # every target; facilitator calls no chrono API itself.
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained via concordium-* and keetanetwork-asn1; transitive-only, facilitator uses none of its API; remove when upstream moves; review by 2027-02-27" },
]

[licenses]
confidence-threshold = 0.8
allow                = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSD-1-Clause",
    "ISC",
    "CC0-1.0",
    "Unlicense",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
# tonlib-core (r402-tvm) depends on nacl.
exceptions           = [
    { crate = "nacl", allow = ["LGPL-3.0-or-later"] },
]

[licenses.private]
ignore = false

[bans]
multiple-versions          = "warn"
wildcards                  = "deny"
highlight                  = "all"
workspace-default-features = "allow"
external-default-features  = "allow"
allow-workspace            = true

deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
