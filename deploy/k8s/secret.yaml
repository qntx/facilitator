# Operator-supplied hot-wallet material. Do not commit real keys.
#   kubectl create secret generic facilitator-secrets \
#     --from-file=evm.key=./evm.key \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# evm.key is mounted at /run/secrets/evm.key (config source = "file").
# Default Deployment + ConfigMap are EVM-only. solana.key is unused until:
#   1. replace the placeholder (base58 fee-payer), or
#        kubectl create secret generic facilitator-secrets \
#          --from-file=evm.key=./evm.key \
#          --from-file=solana.key=./solana.key \
#          --dry-run=client -o yaml | kubectl apply -f -
#   2. mount it in deployment.yaml secrets volume items
#        - key: solana.key
#          path: solana.key
#      (kubelet fails the pod if the Secret key is missing — do not add
#      the volume item until the key exists)
#   3. add SVM tables from config.example.full.toml to the ConfigMap
#      ([signer.svm_fee] path = "/run/secrets/solana.key")
# Local compose equivalent: compose.svm.yaml + FACILITATOR_CONFIG=./config.example.full.toml
apiVersion: v1
kind: Secret
metadata:
  name: facilitator-secrets
  labels:
    app.kubernetes.io/name: facilitator
    app.kubernetes.io/version: "2.0.0"
type: Opaque
stringData:
  # 0x-prefixed hex secp256k1. Replace before apply.
  evm.key: "REPLACE_WITH_0x_PREFIXED_HEX_SECP256K1"
  # Optional. Not mounted by the default Deployment.
  solana.key: "REPLACE_WITH_BASE58_SOLANA_FEE_PAYER"
