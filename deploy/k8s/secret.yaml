# Operator-supplied hot-wallet material. Do not commit real keys.
#   kubectl create secret generic facilitator-secrets \
#     --from-file=evm.key=./evm.key \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# File is mounted at /run/secrets/evm.key (config source = "file").
apiVersion: v1
kind: Secret
metadata:
  name: facilitator-secrets
  labels:
    app.kubernetes.io/name: facilitator
    app.kubernetes.io/version: "2.0.0"
type: Opaque
stringData:
  # 0x-prefixed hex secp256k1. Replace before apply.
  evm.key: "REPLACE_WITH_0x_PREFIXED_HEX_SECP256K1"
