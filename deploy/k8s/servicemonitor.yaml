# Headless scrape Service: Endpoints are pod IPs on container port 9090.
# Not localhost. Not the protocol Service (that has no /metrics).
apiVersion: v1
kind: Service
metadata:
  name: facilitator-metrics
  labels:
    app.kubernetes.io/name: facilitator
    app.kubernetes.io/component: metrics
    app.kubernetes.io/version: "2.0.0"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: facilitator
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: facilitator
  labels:
    app.kubernetes.io/name: facilitator
    app.kubernetes.io/component: metrics
    app.kubernetes.io/version: "2.0.0"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: facilitator
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: 30s
      scrapeTimeout: 5s
