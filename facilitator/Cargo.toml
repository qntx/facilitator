[package]
name = "facilitator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
readme = "../README.md"

[lib]
name = "facilitator"
path = "src/lib.rs"

[[bin]]
name = "facilitator"
path = "src/main.rs"

[features]
default = ["telemetry", "chain-eip155"]
chain-eip155 = ["dep:r402-evm", "dep:alloy-network", "dep:alloy-signer-local", "dep:url"]
chain-near = ["dep:r402-near"]
chain-xrpl = ["dep:r402-xrpl"]
# chain-tron is blocked: r402-tron 0.17.1 only implements SchemeBuilder<TronChainProvider>
# (owned). TronChainProvider is not Clone, and SchemeBuilder<&TronChainProvider> in this
# binary is orphan-illegal (foreign trait + foreign types).
telemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-semantic-conventions",
    "dep:tracing-opentelemetry",
    "r402-evm?/telemetry",
    "r402-near?/telemetry",
    "r402-xrpl?/telemetry",
]

[dependencies]
axum = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
r402-core = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-semantic-conventions = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
r402-evm = { workspace = true, optional = true }
r402-near = { workspace = true, optional = true }
r402-xrpl = { workspace = true, optional = true }
alloy-network = { workspace = true, optional = true }
alloy-signer-local = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
axum = { workspace = true }
http-body-util = { workspace = true }
r402-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true
