[package]
name = "facilitator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
readme = "../README.md"

[lib]
name = "facilitator"
path = "src/lib.rs"

[[bin]]
name = "facilitator"
path = "src/main.rs"

[features]
default = ["telemetry", "chain-eip155", "chain-solana"]
chain-eip155 = ["dep:r402-evm", "dep:alloy-network", "dep:alloy-signer-local", "dep:url"]
chain-solana = ["dep:r402-solana", "dep:solana-keypair", "dep:bs58"]
telemetry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry-semantic-conventions",
    "dep:tracing-opentelemetry",
    "r402-evm?/telemetry",
    "r402-solana?/telemetry",
]

[dependencies]
axum = { workspace = true }
clap = { workspace = true }
dotenvy = { workspace = true }
r402-core = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry-semantic-conventions = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
r402-evm = { workspace = true, optional = true }
r402-solana = { workspace = true, optional = true }
alloy-network = { workspace = true, optional = true }
alloy-signer-local = { workspace = true, optional = true }
url = { workspace = true, optional = true }
solana-keypair = { workspace = true, optional = true }
bs58 = { workspace = true, optional = true }

[dev-dependencies]
axum = { workspace = true }
http-body-util = { workspace = true }
r402-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true
